name: MLBデータ自動更新

on:
  schedule:
    # 日本時間 19:07/20:07/21:07（timezoneフィールドで直接JST指定、UTC換算のミスを排除）
    # ちょうど「◯時0分」はGitHub全体で負荷が集中しやすく、遅延やドロップの原因になる
    # （GitHub公式ドキュメントで明言されている）ため、あえて半端な分にずらしている。
    # 19:07が発火しなかった/失敗した場合の再試行として20:07・21:07を用意。
    # 既に当日分がコミット済みなら「重複実行チェック」で自動的に何もせず終わる。
    - cron: '7 19 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7 20 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7 21 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付（例: 2026-08-20 / 2026-08-17:2026-08-24 / 空欄なら自動計算）'
        required: false
        default: ''
      steps:
        description: '実行ステップ（games / highlights / datamart / all。スペース区切りで複数可）'
        required: false
        default: 'all'

permissions:
  contents: write


jobs:
  update-mlb:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 一時停止スイッチの確認（スケジュール実行のみ）
        id: pause
        run: |
          PAUSED="${{ vars.AUTO_UPDATE_PAUSED }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$PAUSED" = "true" ]; then
            echo "AUTO_UPDATE_PAUSED=true のため、今回の自動実行はスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 対象日付を計算
        id: date
        if: steps.pause.outputs.skip != 'true'
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            TARGET="${{ inputs.date }}"
          else
            # run_mlb.py 側が内部で「date-1日」のStatcastを取得し「date」ラベルで
            # 保存する時差調整ロジックを既に持っているため、ここでは前日にずらさず
            # 日本時間の「今日」をそのまま渡す。
            TARGET=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "対象日: $TARGET"

      - name: 重複実行チェック（スケジュール実行のみ）
        id: check
        if: steps.pause.outputs.skip != 'true'
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST_MSG=$(git log -1 --pretty=%s)
            if echo "$LAST_MSG" | grep -q "MLB自動更新: ${{ steps.date.outputs.date }}"; then
              echo "既に ${{ steps.date.outputs.date }} 分は処理済みのためスキップします"
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: MLBデータを取得・更新
        if: steps.pause.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_mlb.py --date ${{ steps.date.outputs.date }} --steps ${{ inputs.steps || 'all' }}

      - name: 活躍選手0件の日付がないか確認
        if: steps.pause.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        run: |
          python - <<'PYEOF'
          import json, glob, datetime, os

          steps_arg = os.environ.get("STEPS_ARG", "all")
          if "highlights" not in steps_arg and steps_arg != "all":
              raise SystemExit(0)

          target = os.environ.get("TARGET_DATE", "")
          if ":" in target:
              d0s, d1s = target.split(":")
              d0 = datetime.date.fromisoformat(d0s)
              d1 = datetime.date.fromisoformat(d1s)
              dates = [(d0 + datetime.timedelta(days=i)).isoformat()
                       for i in range((d1 - d0).days + 1)]
          else:
              dates = [target]

          missing = []
          for d in dates:
              found_file = False
              has_hl = False
              for path in glob.glob(f"docs/data/MLB/*/*/games/json/{d}.json"):
                  found_file = True
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  games = data.get(d) or []
                  hl = (data.get("highlights") or {}).get(d) or []
                  if not games:
                      # その日は試合自体がなかった → 活躍選手なしで正常
                      has_hl = True
                      break
                  if hl:
                      has_hl = True
                  break
              if found_file and not has_hl:
                  missing.append(d)

          if missing:
              print(f"::warning::活躍選手が0件の日付があります: {', '.join(missing)}。--steps highlights で該当日を再実行してください")
          else:
              print("活躍選手チェック: 問題なし")
          PYEOF
        env:
          STEPS_ARG: ${{ inputs.steps || 'all' }}
          TARGET_DATE: ${{ steps.date.outputs.date }}

      - name: 変更をコミット&push
        if: steps.pause.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "更新なし（データ変化なし）"
          else
            git commit -m "MLB自動更新: ${{ steps.date.outputs.date }} (steps: ${{ inputs.steps || 'all' }})"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push失敗。リモートの変更を取り込んでリトライします (試行 $i/5)"
              git pull --rebase origin main
              sleep 5
            done
          fi
