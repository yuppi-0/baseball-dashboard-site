<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投手AI解釈カード</title>
<style>
  :root{
    --bg: #05080F;
    --panel: #0F1B2E;
    --panel-alt: #111F33;
    --border: rgba(59,130,246,0.16);
    --text: #E2E8F0;
    --text-dim: #94A3B8;
    --text-bright: #F1F5F9;
    --green: #10B981;
    --green-text: #6EE7B7;
    --red: #F87171;
    --red-text: #FCA5A5;
    --blue: #3B82F6;
    --blue-text: #93C5FD;
    --amber: #F59E0B;
    --amber-text: #FCD34D;
  }
  * { box-sizing: border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
  }
  .app{ display:flex; flex-direction:column; min-height:100vh; }
  header{
    padding:20px 24px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  header h1{ font-size:17px; margin:0; font-weight:700; color:var(--text-bright); letter-spacing:0.01em; }
  .league-toggle{ display:flex; gap:6px; background:var(--panel); border-radius:8px; padding:3px; }
  .league-toggle button{
    border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:700;
    padding:6px 14px; border-radius:6px; cursor:pointer;
  }
  .league-toggle button.active{ background:var(--panel-alt); color:var(--text-bright); }
  .team-select{
    background:var(--panel); border:1px solid rgba(148,163,184,0.2); border-radius:8px;
    color:var(--text); font-size:12px; padding:7px 10px; outline:none;
  }
  .header-controls{ display:flex; gap:8px; align-items:center; }

  .body-layout{ display:flex; flex:1; min-height:0; }
  .sidebar{
    width:260px; flex-shrink:0; border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; max-height:100vh;
  }
  .filter-box{ padding:10px 14px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  .filter-row{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); }
  .filter-row input[type="checkbox"]{ accent-color:var(--blue); }
  .filter-row input[type="number"]{
    width:56px; background:var(--panel); border:1px solid rgba(148,163,184,0.2); border-radius:6px;
    color:var(--text); font-size:11px; padding:3px 6px; outline:none;
  }
  .search-box{ padding:14px; border-bottom:1px solid var(--border); }
  .search-box input{
    width:100%; background:var(--panel); border:1px solid rgba(148,163,184,0.2); border-radius:8px;
    padding:9px 12px; color:var(--text); font-size:13px; outline:none;
  }
  .search-box input:focus{ border-color: var(--blue); }
  .player-list{ overflow-y:auto; flex:1; padding:6px; }
  .player-item{
    display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:8px;
    cursor:pointer; margin-bottom:2px;
  }
  .player-item:hover{ background:var(--panel); }
  .player-item.active{ background:var(--panel-alt); }
  .player-item .name{ font-size:13px; font-weight:700; color:var(--text-bright); }
  .player-item .meta{ font-size:11px; color:var(--text-dim); }
  .empty-list{ padding:20px 14px; font-size:12px; color:var(--text-dim); }

  main{ flex:1; overflow-y:auto; padding:20px; display:flex; justify-content:center; }
  .placeholder{ color:var(--text-dim); font-size:13px; padding-top:60px; text-align:center; width:100%; }

  .card{ width:100%; max-width:520px; text-align:left; }
  .p-header{ display:flex; align-items:center; gap:12px; margin-bottom:14px; text-align:left; }
  .p-avatar{
    width:44px; height:44px; border-radius:10px; background:#1E3A5F; color:#93C5FD;
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; flex-shrink:0;
  }
  .p-name{ font-size:18px; font-weight:700; color:var(--text-bright); }
  .p-meta{ font-size:12px; color:var(--text-dim); margin-top:2px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .stat-box{ background:var(--panel); border-radius:8px; padding:10px 6px; text-align:center; }
  .stat-box .label{ font-size:10px; color:var(--text-dim); margin-bottom:3px; }
  .stat-box .value{ font-size:16px; font-weight:700; }
  .stat-box .rank{ font-size:9px; color:var(--text-dim); margin-top:3px; }
  .stat-box .rank b{ color:var(--blue-text); font-weight:700; }

  .section{ border-radius:10px; padding:12px 14px; margin-bottom:10px; text-align:left; }
  .section-type{ background:var(--panel); }
  .section-strength{ background:var(--panel-alt); border:1px solid rgba(16,185,129,0.25); }
  .section-weakness{ background:#221417; border:1px solid rgba(248,113,113,0.25); }
  .section-pitches{ background:var(--panel); }
  .section-design{ background:#1A140B; border:1px solid rgba(245,158,11,0.3); }
  .section-gamelog{ background:var(--panel); }
  .section-profile{ background:var(--panel); border:1px solid rgba(148,163,184,0.15); }

  .section-title{
    display:flex; align-items:center; gap:6px; margin-bottom:9px; cursor:pointer; user-select:none;
  }
  .section-title .bar{ width:3px; height:13px; border-radius:2px; flex-shrink:0; }
  .section-title .label{ font-size:11px; font-weight:700; letter-spacing:0.05em; }
  .section-title .sub{ font-size:10px; color:var(--text-dim); margin-left:2px; }
  .section-title .toggle-hint{ margin-left:auto; font-size:10px; color:#64748B; }
  .section-title .chev{ margin-left:auto; color:#64748B; font-size:11px; transition:transform 0.15s; }
  .section-body{ overflow:hidden; }
  .section-body.collapsed{ display:none; }

  .profile-sub{ padding-top:10px; border-top:1px solid rgba(148,163,184,0.12); margin-top:10px; }
  .profile-sub:first-child{ padding-top:0; border-top:none; margin-top:0; }
  .profile-sub-title{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .profile-sub-title .bar{ width:3px; height:12px; border-radius:2px; flex-shrink:0; }
  .profile-sub-title .label{ font-size:10px; font-weight:700; letter-spacing:0.06em; }

  .tag{
    display:inline-block; border-radius:6px; padding:3px 10px; font-size:11px; font-weight:700; margin-bottom:9px;
    text-align:left;
  }
  .bullets{ text-align:left; }
  .bullets div{ display:flex; gap:6px; margin-bottom:6px; font-size:12.5px; line-height:1.6; text-align:left; }
  .bullets div:last-child{ margin-bottom:0; }
  .bullets .dot{ flex-shrink:0; }
  .bullets.tone-positive div{ color:var(--green-text); }
  .bullets.tone-positive .dot{ color:var(--green); }
  .bullets.tone-negative div{ color:var(--red-text); }
  .bullets.tone-negative .dot{ color:var(--red); }
  .bullets div b{ color:var(--text-bright); }
  .bullets.tone-positive div b{ color:#A7F3D0; }
  .bullets.tone-negative div b{ color:#FECACA; }

  /* 試合ログテーブル */
  .gamelog-table{ width:100%; border-collapse:collapse; font-size:11px; }
  .gamelog-table th{
    text-align:left; font-weight:700; color:var(--text-dim); padding:5px 6px; white-space:nowrap;
    border-bottom:1px solid rgba(148,163,184,0.15);
  }
  .gamelog-table td{ padding:6px; white-space:nowrap; text-align:left; }
  .gamelog-table .row-season td{ font-weight:700; color:var(--amber-text); border-bottom:1px solid rgba(59,130,246,0.25); }
  .gamelog-table .row-game td{ border-bottom:1px solid rgba(148,163,184,0.08); color:var(--text); cursor:pointer; }
  .gamelog-table .row-game:hover td{ background:rgba(148,163,184,0.06); }
  .gamelog-table .row-detail td{ border-bottom:1px solid rgba(148,163,184,0.08); padding:10px 8px; }
  .gamelog-detail{ display:flex; flex-wrap:wrap; gap:14px; font-size:11px; color:var(--text-dim); margin-bottom:10px; }
  .gamelog-detail b{ color:var(--text-bright); font-size:12px; }

  /* 球種詳細テーブル（本家と同じ列構成） */
  .hand-toggle{ display:flex; gap:4px; margin-bottom:10px; }
  .hand-toggle button{
    border:none; background:var(--panel-alt); color:var(--text-dim); font-size:10.5px; font-weight:700;
    padding:5px 12px; border-radius:6px; cursor:pointer;
  }
  .hand-toggle button.active{ background:#fff; color:#000; }
  .pmix-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:14px; }
  .pmix-table{ width:100%; border-collapse:collapse; min-width:560px; font-family:'DM Mono',monospace; }
  .pmix-table th{
    padding:6px 8px; font-size:9px; font-weight:600; color:var(--text-dim); white-space:nowrap;
    text-align:left; background:var(--panel-alt); border-bottom:1px solid rgba(148,163,184,0.15);
  }
  .pmix-table td{ padding:7px 8px; font-size:12px; text-align:left; white-space:nowrap; border-bottom:1px solid rgba(255,255,255,0.04); }
  .pmix-table tfoot td{ padding:6px 8px; font-size:11px; font-weight:700; border-top:2px solid rgba(59,130,246,0.3); background:var(--panel-alt); }
  .pmix-pname{ display:inline-flex; align-items:center; gap:6px; }
  .pmix-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block; }

  /* コース分布グリッド（本家と同じ強度スケール） */
  .course-wrap{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .course-block .ctitle{ font-size:9px; color:var(--text-dim); font-family:'DM Mono',monospace; margin-bottom:5px; }
  .course-grid-table{ border-collapse:collapse; font-family:'DM Mono',monospace; }
  .course-grid-table td{
    width:52px; height:42px; text-align:center; vertical-align:middle; padding:0;
    border:1px solid rgba(255,255,255,0.08);
  }
  .course-cell-top{ font-size:12px; font-weight:700; line-height:1.3; }
  .course-cell-bot{ font-size:9px; line-height:1.1; }
  .gamelog-table .cell-good{ background:rgba(16,185,129,0.18); color:var(--green-text); border-radius:4px; }
  .gamelog-table .cell-bad{ background:rgba(248,113,113,0.18); color:var(--red-text); border-radius:4px; }
  .gamelog-scroll{ overflow-x:auto; }

  .pitch-row{
    width:100%; background:none; border:none; display:flex; align-items:center; gap:8px;
    padding:9px 0; cursor:pointer; text-align:left; color:inherit; font: inherit;
    border-top:1px solid rgba(148,163,184,0.12);
  }
  .pitch-row:first-child{ border-top:none; }
  .pitch-row .pdot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .pitch-row .pname{ font-size:13px; font-weight:700; }
  .pitch-row .pcount{ font-size:11px; color:var(--text-dim); }
  .pitch-row .ptag{ font-size:10px; font-weight:700; border-radius:5px; padding:2px 7px; margin-left:2px; }
  .pitch-row .chev{ margin-left:auto; color:#64748B; font-size:11px; transition:transform 0.15s; }
  .pitch-body{ padding:0 0 10px 15px; }

  .error{ color:var(--red-text); font-size:13px; padding-top:40px; text-align:center; width:100%; }

  @media (max-width:720px){
    .body-layout{ flex-direction:column; }
    .sidebar{ width:100%; max-height:260px; height:auto; position:static; border-right:none; border-bottom:1px solid var(--border); }
    main{ padding:14px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>投手 AI解釈カード</h1>
    <div class="header-controls">
      <select id="teamSelect" class="team-select">
        <option value="">全チーム</option>
      </select>
      <div class="league-toggle">
        <button data-league="npb" class="active">プロ野球</button>
        <button data-league="mlb">MLB</button>
      </div>
    </div>
  </header>

  <div class="body-layout">
    <aside class="sidebar">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="選手名で検索">
      </div>
      <div class="filter-box">
        <label class="filter-row">
          <input id="aiOnlyFilter" type="checkbox">
          AIコメントがある選手のみ
        </label>
        <label class="filter-row">
          投球回
          <input id="minIpFilter" type="number" min="0" step="1" placeholder="0">
          回以上
        </label>
      </div>
      <div class="player-list" id="playerList">
        <div class="empty-list">読み込み中…</div>
      </div>
    </aside>

    <main>
      <div id="mainContent" class="placeholder">左の一覧から選手を選んでください</div>
    </main>
  </div>
</div>

<script>
// ── データパス設定 ──
// 年やリーグのフォルダ構成が変わったらここだけ直せばよい
const LEAGUE_PATHS = {
  npb: {
    numeric: "data/プロ野球/2026年/1軍/レギュラーシーズン/pitcher_cards_numeric",
    batches: "data/プロ野球/2026年/1軍/レギュラーシーズン/pitcher_cards_llm/batches",
  },
  mlb: {
    numeric: "data/MLB/2026年/公式戦/pitcher_cards_numeric",
    batches: "data/MLB/2026年/公式戦/pitcher_cards_llm/batches",
  },
};

let currentLeague = "npb";
let allPlayers = [];
let activePlayerId = null;

const el = (sel) => document.querySelector(sel);
const playerListEl = el("#playerList");
const mainContentEl = el("#mainContent");
const searchInputEl = el("#searchInput");
const teamSelectEl = el("#teamSelect");
const aiOnlyFilterEl = el("#aiOnlyFilter");
const minIpFilterEl = el("#minIpFilter");

// AIコメントがある選手名の集合。リーグを開いたときに一度だけバッチ全件を読んで作る
let playersWithLlmData = new Set();
let llmDataLoaded = false;

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

async function loadPlayerIndex(league){
  playerListEl.innerHTML = '<div class="empty-list">読み込み中…</div>';
  mainContentEl.innerHTML = '<div class="placeholder">左の一覧から選手を選んでください</div>';
  activePlayerId = null;
  llmDataLoaded = false;
  playersWithLlmData = new Set();
  aiOnlyFilterEl.checked = false;
  try{
    // 選手一覧は「数値データ」側のindex.jsonを正とする（LLM解釈がまだない選手も一覧には出す）
    const res = await fetch(`${LEAGUE_PATHS[league].numeric}/index.json`, { cache: "no-store" });
    if(!res.ok) throw new Error(`index.json の取得に失敗しました (${res.status})`);
    const data = await res.json();
    allPlayers = data.players || [];
    populateTeamSelect(allPlayers);
    renderPlayerList(applyFilters());
  }catch(e){
    playerListEl.innerHTML = `<div class="empty-list">選手一覧を読み込めませんでした。<br>(${escapeHtml(e.message)})</div>`;
  }
}

function populateTeamSelect(players){
  const teams = [...new Set(players.map(p => p.team).filter(Boolean))].sort();
  teamSelectEl.innerHTML = '<option value="">全チーム</option>' +
    teams.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
}

function renderPlayerList(players){
  if(!players.length){
    playerListEl.innerHTML = '<div class="empty-list">該当する選手がいません</div>';
    return;
  }
  playerListEl.innerHTML = players.map(p => `
    <div class="player-item ${p.id === activePlayerId ? 'active' : ''}" data-id="${escapeHtml(p.id)}" data-name="${escapeHtml(p.name)}">
      <div class="name">${escapeHtml(p.name)}</div>
      <div class="meta">${escapeHtml(p.team || "")}${p.role ? " ・ " + escapeHtml(p.role) : ""}</div>
    </div>
  `).join("");
  playerListEl.querySelectorAll(".player-item").forEach(item => {
    item.addEventListener("click", () => selectPlayer(item.dataset.id, item.dataset.name));
  });
}

// ── LLMバッチを新しい順に検索し、該当選手のデータを見つけたら返す（見つからなければnull）──
// バッチファイル名は日付時刻順にソートできる形式（例: 20260901_1400.json）を前提とする
async function findLlmDataForPlayer(playerName){
  try{
    const idxRes = await fetch(`${LEAGUE_PATHS[currentLeague].batches}/index.json`, { cache: "no-store" });
    if(!idxRes.ok) return null;
    const idx = await idxRes.json();
    const files = (idx.batches || []).slice().sort().reverse(); // ファイル名降順 = 新しい順
    for(const file of files){
      try{
        const res = await fetch(`${LEAGUE_PATHS[currentLeague].batches}/${file}`, { cache: "no-store" });
        if(!res.ok) continue;
        const batch = await res.json();
        const list = Array.isArray(batch) ? batch : [batch];
        const hit = list.find(entry => {
          const n = entry["選手名"] || entry.player_name || entry.name;
          return n === playerName;
        });
        if(hit) return hit;
      }catch(e){ continue; }
    }
  }catch(e){ /* バッチ一覧自体がまだ無い場合は静かに諦める */ }
  return null;
}

// ── 数値データ(numeric) + LLM解釈テキスト(llm) をブラウザ内でマージする ──
// merge_card_json.py と同じ役割をJSで行う（Pythonの手動実行を不要にするため）
function mergeCardData(numeric, llm){
  llm = llm || {};
  const pitchEvalsNumeric = numeric.pitch_evaluations_numeric || [];
  const llmPitchByName = {};
  (llm.pitch_evaluations || []).forEach(pe => { llmPitchByName[pe.name] = pe; });

  const pitch_evaluations = pitchEvalsNumeric.map(p => {
    const l = llmPitchByName[p.name] || {};
    return {
      name: p.name,
      count: p.count,
      pct: p.pct,
      tag: l.tag || "",
      bullets: l.bullets || [],
    };
  });

  return {
    name: numeric.name,
    team: numeric.team,
    throws_bats: llm.throws_bats || "",
    role: numeric.role,
    games: numeric.games,
    innings: numeric.innings,
    era: numeric.era,
    k_bb_pct: numeric.k_bb_pct,
    gb_pct: numeric.gb_pct,
    signature_pitch: llm.signature_pitch || "",
    rankings: numeric.rankings || {},
    season_label: llm.season_label || "シーズン",
    swstr_pct_season: numeric.swstr_pct_season,
    chase_pct_season: numeric.chase_pct_season,
    strike_pct_season: numeric.strike_pct_season,
    zone_pct_season: numeric.zone_pct_season,
    kbb_pct_season: numeric.kbb_pct_season,
    k_pct_season: numeric.k_pct_season,
    bb_pct_season: numeric.bb_pct_season,
    gb_pct_season: numeric.gb_pct,
    player_type: llm.player_type || null,
    strengths: llm.strengths || [],
    weaknesses: llm.weaknesses || [],
    pitch_evaluations,
    design_suggestions: llm.design_suggestions || [],
    game_log: numeric.game_log || [],
  };
}

async function selectPlayer(id, name){
  activePlayerId = id;
  renderPlayerList(applyFilters());
  mainContentEl.innerHTML = '<div class="placeholder">読み込み中…</div>';
  try{
    const res = await fetch(`${LEAGUE_PATHS[currentLeague].numeric}/${id}.json`, { cache: "no-store" });
    if(!res.ok) throw new Error(`選手データの取得に失敗しました (${res.status})`);
    const numeric = await res.json();
    const llm = await findLlmDataForPlayer(name || numeric.name);
    const merged = mergeCardData(numeric, llm);
    renderCard(merged);
    if(!llm){
      mainContentEl.insertAdjacentHTML("afterbegin",
        `<div style="font-size:11px;color:var(--text-dim);margin-bottom:10px">
          ※ この選手のAI解釈テキストはまだ生成されていません（数値データのみ表示中）
        </div>`);
    }
  }catch(e){
    mainContentEl.innerHTML = `<div class="error">カードを読み込めませんでした。<br>(${escapeHtml(e.message)})</div>`;
  }
}

function applyFilters(){
  const q = (searchInputEl.value || "").trim().toLowerCase();
  const team = teamSelectEl.value;
  const aiOnly = aiOnlyFilterEl.checked;
  const minIp = parseFloat(minIpFilterEl.value);
  return allPlayers.filter(p => {
    const matchesQuery = !q || (p.name || "").toLowerCase().includes(q);
    const matchesTeam = !team || p.team === team;
    const matchesAi = !aiOnly || playersWithLlmData.has(p.name);
    const matchesIp = isNaN(minIp) || (p.innings_num != null && p.innings_num >= minIp);
    return matchesQuery && matchesTeam && matchesAi && matchesIp;
  });
}

searchInputEl.addEventListener("input", () => {
  renderPlayerList(applyFilters());
});

teamSelectEl.addEventListener("change", () => {
  renderPlayerList(applyFilters());
});

minIpFilterEl.addEventListener("input", () => {
  renderPlayerList(applyFilters());
});

aiOnlyFilterEl.addEventListener("change", async () => {
  if(aiOnlyFilterEl.checked && !llmDataLoaded){
    aiOnlyFilterEl.disabled = true;
    await loadAllLlmPlayerNames();
    aiOnlyFilterEl.disabled = false;
  }
  renderPlayerList(applyFilters());
});

// リーグ内の全バッチファイルを読み、「AI解釈テキストがある選手名」の集合を作る（1回だけキャッシュ）
async function loadAllLlmPlayerNames(){
  playersWithLlmData = new Set();
  try{
    const idxRes = await fetch(`${LEAGUE_PATHS[currentLeague].batches}/index.json`, { cache: "no-store" });
    if(idxRes.ok){
      const idx = await idxRes.json();
      const files = idx.batches || [];
      await Promise.all(files.map(async file => {
        try{
          const res = await fetch(`${LEAGUE_PATHS[currentLeague].batches}/${file}`, { cache: "no-store" });
          if(!res.ok) return;
          const batch = await res.json();
          const list = Array.isArray(batch) ? batch : [batch];
          list.forEach(entry => {
            const n = entry["選手名"] || entry.player_name || entry.name;
            if(n) playersWithLlmData.add(n);
          });
        }catch(e){ /* このバッチはスキップ */ }
      }));
    }
  }catch(e){ /* バッチ一覧が無ければ空のまま */ }
  llmDataLoaded = true;
}

document.querySelectorAll(".league-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    if(btn.dataset.league === currentLeague) return;
    document.querySelectorAll(".league-toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentLeague = btn.dataset.league;
    searchInputEl.value = "";
    loadPlayerIndex(currentLeague);
  });
});

// ── カード描画 ──
function bulletsHtml(items, dotColor, tone){
  const toneClass = tone ? ` tone-${tone}` : "";
  return `<div class="bullets${toneClass}">${(items || []).map(b => `
    <div><span class="dot" style="color:${dotColor}">・</span><span>${escapeHtml(b)}</span></div>
  `).join("")}</div>`;
}

// section-title (開閉ヘッダー) を統一生成
function sectionHeader({bar, label, labelColor, sub}){
  return `
    <div class="section-title" data-toggle="1">
      <span class="bar" style="background:${bar}"></span>
      <span class="label" style="color:${labelColor}">${label}</span>
      ${sub ? `<span class="sub">${sub}</span>` : ""}
      <span class="chev">︾</span>
    </div>
  `;
}

function renderCard(d){
  const initial = (d.name || "?").trim().charAt(0);
  const rk = d.rankings || {};
  const rankText = (key) => rk[key] ? `<div class="rank"><b>${rk[key].rank}</b>位 / ${rk[key].total}人中</div>` : "";
  const stats = [
    { label: "防御率", value: d.era, color: (d.era != null && d.era < 3.5) ? "var(--green-text)" : "var(--red-text)", rankKey: "era" },
    { label: "K-BB%", value: d.k_bb_pct != null ? d.k_bb_pct + "%" : "-", color: "var(--green-text)", rankKey: "k_bb_pct" },
    { label: "ゴロ率", value: d.gb_pct != null ? d.gb_pct + "%" : "-", color: "var(--green-text)", rankKey: "gb_pct" },
    { label: "決め球", value: d.signature_pitch || "-", color: "var(--blue-text)", small: true }
  ];

  const pitchesHtml = (d.pitch_evaluations || []).map((p, i) => `
    <button class="pitch-row" data-idx="${i}">
      <span class="pdot" style="background:${pitchColor(i)}"></span>
      <span class="pname" style="color:${pitchColor(i)}">${escapeHtml(p.name)}</span>
      <span class="pcount">${p.count != null ? p.count + '球・' : ''}${p.pct != null ? p.pct + '%' : ''}</span>
      ${p.tag ? `<span class="ptag" style="background:rgba(59,130,246,0.18);color:var(--blue-text)">${escapeHtml(p.tag)}</span>` : ""}
      <span class="chev">︾</span>
    </button>
    <div class="pitch-body" data-body="${i}" style="display:none">
      ${bulletsHtml(p.bullets, "var(--text-dim)")}
    </div>
  `).join("");

  const gameLogHtml = buildGameLogTable(d);

  // 選手特徴・強み・弱み を1つの枠にまとめる（区切り線つき）
  const profileHtml = `
    <div class="section section-profile">
      ${sectionHeader({ bar:"var(--blue)", label:"選手プロフィール", labelColor:"var(--text-bright)" })}
      <div class="section-body">
        ${d.player_type ? `
        <div class="profile-sub">
          <div class="profile-sub-title"><span class="bar" style="background:var(--text-dim)"></span><span class="label" style="color:#CBD5E1">選手特徴</span></div>
          <div class="tag" style="background:rgba(148,163,184,0.15);border:1px solid rgba(148,163,184,0.35);color:var(--text)">${escapeHtml(d.player_type.tag || "")}</div>
          ${bulletsHtml(d.player_type.bullets, "var(--text-dim)")}
        </div>` : ""}

        ${d.strengths?.length ? `
        <div class="profile-sub">
          <div class="profile-sub-title"><span class="bar" style="background:var(--green)"></span><span class="label" style="color:var(--green-text)">強み</span></div>
          ${bulletsHtml(d.strengths, "var(--green)", "positive")}
        </div>` : ""}

        ${d.weaknesses?.length ? `
        <div class="profile-sub">
          <div class="profile-sub-title"><span class="bar" style="background:var(--red)"></span><span class="label" style="color:var(--red-text)">弱み</span></div>
          ${bulletsHtml(d.weaknesses, "var(--red)", "negative")}
        </div>` : ""}
      </div>
    </div>
  `;

  mainContentEl.innerHTML = `
    <div class="card">
      <div class="p-header">
        <div class="p-avatar">${escapeHtml(initial)}</div>
        <div>
          <div class="p-name">${escapeHtml(d.name)}</div>
          <div class="p-meta">${escapeHtml(d.team || "")}・${escapeHtml(d.throws_bats || "")}・${escapeHtml(d.role || "")}・${d.games ?? "-"}登板 ${d.innings ?? "-"}回</div>
        </div>
      </div>

      <div class="stat-grid">
        ${stats.map(s => `
          <div class="stat-box">
            <div class="label">${s.label}</div>
            <div class="value" style="color:${s.color}; ${s.small ? 'font-size:13px' : ''}">${escapeHtml(String(s.value))}</div>
            ${s.rankKey ? rankText(s.rankKey) : ""}
          </div>
        `).join("")}
      </div>

      ${profileHtml}

      ${d.pitch_evaluations?.length ? `
      <div class="section section-pitches">
        ${sectionHeader({ bar:"var(--blue)", label:"球種評価", labelColor:"var(--text-bright)" })}
        <div class="section-body">${pitchesHtml}</div>
      </div>` : ""}

      ${d.design_suggestions?.length ? `
      <div class="section section-design">
        ${sectionHeader({ bar:"var(--amber)", label:"ピッチングデザイン提案", labelColor:"var(--amber-text)" })}
        <div class="section-body">${bulletsHtml(d.design_suggestions, "var(--amber)")}</div>
      </div>` : ""}

      ${gameLogHtml}
    </div>
  `;

  // 球種評価: 個別球種の開閉
  mainContentEl.querySelectorAll(".pitch-row").forEach(row => {
    row.addEventListener("click", () => {
      const idx = row.dataset.idx;
      const body = mainContentEl.querySelector(`.pitch-body[data-body="${idx}"]`);
      const chev = row.querySelector(".chev");
      const isOpen = body.style.display !== "none";
      body.style.display = isOpen ? "none" : "block";
      chev.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
    });
  });

  // 各セクション枠（選手プロフィール／球種評価／提案／試合成績）の開閉
  mainContentEl.querySelectorAll(".section-title[data-toggle]").forEach(title => {
    title.addEventListener("click", () => {
      const body = title.nextElementSibling;
      const chev = title.querySelector(".chev");
      const isCollapsed = body.classList.toggle("collapsed");
      chev.style.transform = isCollapsed ? "rotate(-90deg)" : "rotate(0deg)";
    });
  });

  // 試合ログ: 行クリックで詳細開閉
  mainContentEl.querySelectorAll(".row-game[data-gidx]").forEach(row => {
    row.addEventListener("click", () => {
      const idx = row.dataset.gidx;
      const detail = mainContentEl.querySelector(`.row-detail[data-gdetail="${idx}"]`);
      if(!detail) return;
      detail.style.display = detail.style.display === "none" ? "table-row" : "none";
    });
  });

  // 試合詳細内: 全体/対右/対左 切り替え
  mainContentEl.querySelectorAll(".hand-toggle").forEach(toggle => {
    toggle.addEventListener("click", (e) => {
      const btn = e.target.closest(".hand-btn");
      if(!btn) return;
      e.stopPropagation();
      const idx = toggle.dataset.gidx;
      const hand = btn.dataset.hand;
      const pitchDetail = idx === "season" ? d.season_pitch_detail : (d.game_log[idx] || {}).pitch_detail;
      if(!pitchDetail) return;

      toggle.querySelectorAll(".hand-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const wrap = mainContentEl.querySelector(`.pmix-wrap[data-gidx="${idx}"]`);
      if(wrap) wrap.innerHTML = pitchDetailTableHtml(pitchDetail[hand]);
    });
  });
}

// ── 試合ログテーブル（シーズン行 + 直近試合の行、行クリックで詳細展開）──
function cellClass(value, goodDir, threshold){
  // goodDir: "high"なら値が高いほど良い、"low"なら低いほど良い
  if(value == null) return "";
  if(goodDir === "high") return value >= threshold ? "cell-good" : (value <= threshold * 0.6 ? "cell-bad" : "");
  return value <= threshold ? "cell-good" : (value >= threshold * 1.6 ? "cell-bad" : "");
}

// ── 球種詳細テーブル（本家ダッシュボードと同じ列構成・パーセンタイル色付け）──
// export_llm_input.py 側で算出した _ランク（top15〜bot85）を、本家と同じ色にマッピングする
const PMIX_METRICS = [
  { key:"swstr_pct",  tierKey:"空振り率_ランク",         label:"空振り率" },
  { key:"chase_pct",  tierKey:"ゾーン外スイング率_ランク", label:"ボール球SW%" },
  { key:"strike_pct", tierKey:"ストライク率_ランク",       label:"ストライク率" },
  { key:"zone_pct",   tierKey:"ゾーン率_ランク",          label:"ゾーン率" },
  { key:"gb_pct",     tierKey:"GB%_ランク",              label:"ゴロ率" }
];
const TIER_COLOR = {
  top15: "rgba(18,165,178,0.40)",
  top30: "rgba(18,165,178,0.25)",
  top40: "rgba(18,165,178,0.12)",
  mid:   "",
  bot60: "rgba(238,122,151,0.10)",
  bot70: "rgba(238,122,151,0.18)",
  bot85: "rgba(238,122,151,0.38)"
};

function pitchDetailTableHtml(pitches){
  if(!pitches || !pitches.length){
    return `<div style="padding:16px;text-align:center;color:var(--text-dim);font-size:12px">データなし</div>`;
  }
  const tc = pitches.reduce((s,m)=>s+(m.count||0), 0);
  const wavg = (key) => tc>0 ? (pitches.reduce((s,m)=>s+((m[key]||0)*(m.count||0)),0)/tc).toFixed(1) : "—";

  const rows = pitches.map(p => `
    <tr>
      <td><span class="pmix-pname"><span class="pmix-dot" style="background:${pitchColor(pitches.indexOf(p))}"></span>${escapeHtml(p.name)}</span></td>
      <td>${p.count ?? "—"}</td>
      <td>${p.pct != null ? p.pct + "%" : "—"}</td>
      ${PMIX_METRICS.map(m => {
        const v = p[m.key];
        const tier = p[m.tierKey];
        const bg = tier ? (TIER_COLOR[tier] || "") : "";
        return `<td style="background:${bg}">${v != null ? v + "%" : "—"}</td>`;
      }).join("")}
    </tr>
  `).join("");

  return `
    <div class="pmix-scroll">
      <table class="pmix-table">
        <thead><tr>
          <th>球種</th><th>投球数</th><th>投球割合</th>
          ${PMIX_METRICS.map(m => `<th>${m.label}</th>`).join("")}
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>合計</td>
          <td>${tc}</td><td>100%</td>
          ${PMIX_METRICS.map(m => `<td>${wavg(m.key)}%</td>`).join("")}
        </tr></tfoot>
      </table>
    </div>
  `;
}

// ── コース分布グリッド（本家の強度スケールをそのまま再現）──
// cells: 9要素の {pct, count} 配列（投手視点、左上→右下）
function courseGridHtml(label, cellsData){
  if(!cellsData || !cellsData.cells || !cellsData.cells.length) return "";
  const cells = cellsData.cells;
  const maxCnt = Math.max(...cells.map(c => c.count || 0), 1);
  let html = `<div class="course-block">
    <div class="ctitle">${escapeHtml(label)}（${cellsData.total ?? "-"}球 ゾーン内）— 投手視点</div>
    <table class="course-grid-table"><tbody>`;
  for(let r = 0; r < 3; r++){
    html += "<tr>";
    for(let c = 0; c < 3; c++){
      const cell = cells[r*3+c] || { pct: 0, count: 0 };
      const intensity = (cell.count || 0) / maxCnt;
      const bgAlpha = (0.05 + intensity * 0.7).toFixed(2);
      const bg = cell.count > 0 ? `rgba(59,130,246,${bgAlpha})` : "rgba(59,130,246,0.03)";
      const textCol = intensity > 0.25 ? "#fff" : (cell.count > 0 ? "var(--text)" : "var(--text-dim)");
      const subCol = intensity > 0.25 ? "rgba(255,255,255,0.75)" : "var(--text-dim)";
      html += `<td style="background:${bg}">
        <div class="course-cell-top" style="color:${textCol}">${cell.pct != null ? cell.pct + "%" : "0.0%"}</div>
        <div class="course-cell-bot" style="color:${subCol}">${cell.count > 0 ? cell.count : ""}</div>
      </td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table></div>";
  return html;
}

function courseDistributionHtml(courseDetail){
  if(!courseDetail) return "";
  return `<div class="course-wrap">
    ${courseGridHtml("対右打者", courseDetail.vsR)}
    ${courseGridHtml("対左打者", courseDetail.vsL)}
  </div>`;
}

function buildGameLogTable(d){
  if(!d.game_log || !d.game_log.length) return "";
  const cols = [
    { key: "swstr_pct", label: "空振り率", good: "high", th: 12 },
    { key: "chase_pct", label: "ボール球SW%", good: "high", th: 30 },
    { key: "strike_pct", label: "ストライク率", good: "high", th: 55 },
    { key: "zone_pct", label: "ゾーン率", good: "high", th: 45 },
    { key: "kbb_pct", label: "K-BB%", good: "high", th: 15 },
    { key: "k_pct", label: "K%", good: "high", th: 22 },
    { key: "bb_pct", label: "BB%", good: "low", th: 8 },
    { key: "gb_pct", label: "ゴロ率", good: "high", th: 42 }
  ];
  const colCount = 3 + cols.length;

  // 行1つぶんの詳細パネル（試合ログ・シーズン行どちらからも呼べる共通処理）
  function buildDetailRow(gidx, basicChipsHtml, pitchDetail, courseDetail){
    const hasPitchDetail = pitchDetail && (pitchDetail.all || pitchDetail.vsR || pitchDetail.vsL);
    const hasCourseDetail = courseDetail && (courseDetail.vsR || courseDetail.vsL);
    if(!basicChipsHtml && !hasPitchDetail && !hasCourseDetail) return "";

    const pitchSection = hasPitchDetail ? `
      <div class="hand-toggle" data-gidx="${gidx}">
        <button class="hand-btn active" data-hand="all">全体</button>
        <button class="hand-btn" data-hand="vsR">対右</button>
        <button class="hand-btn" data-hand="vsL">対左</button>
      </div>
      <div class="pmix-wrap" data-gidx="${gidx}">
        ${pitchDetailTableHtml(pitchDetail.all)}
      </div>
    ` : "";

    const courseSection = hasCourseDetail ? courseDistributionHtml(courseDetail) : "";

    return `
      <tr class="row-detail" data-gdetail="${gidx}" style="display:none">
        <td colspan="${colCount}">
          ${basicChipsHtml || ""}
          ${pitchSection}
          ${courseSection}
        </td>
      </tr>
    `;
  }

  const seasonHasDetail = d.season_pitch_detail || d.season_course_detail;
  const seasonRow = `
    <tr class="row-game row-season" data-gidx="season">
      <td>シーズン</td><td>―</td>
      <td>${d.games ?? "-"}登板 ${d.innings ?? "-"}回</td>
      ${cols.map(c => `<td>${d[c.key + "_season"] != null ? d[c.key + "_season"] + "%" : "-"}</td>`).join("")}
    </tr>
  ` + (seasonHasDetail ? buildDetailRow("season", "", d.season_pitch_detail, d.season_course_detail) : "");

  const gameRows = d.game_log.map((g, i) => {
    const hasBasicDetail = g.ip != null || g.pitches != null || g.k != null || g.bb != null || g.h != null || g.er != null;

    const row = `
      <tr class="row-game" data-gidx="${i}">
        <td>${escapeHtml(g.date || "")}</td>
        <td>${escapeHtml(g.opponent || "")}</td>
        <td>${escapeHtml(g.result || "")}</td>
        ${cols.map(c => {
          const v = g[c.key];
          const cls = cellClass(v, c.good, c.th);
          return `<td class="${cls}">${v != null ? v + "%" : "-"}</td>`;
        }).join("")}
      </tr>
    `;

    const basicChips = hasBasicDetail ? `
      <div class="gamelog-detail">
        ${g.ip != null ? `<span><b>${g.ip}</b>回</span>` : ""}
        ${g.pitches != null ? `<span><b>${g.pitches}</b>球</span>` : ""}
        ${g.k != null ? `<span><b>${g.k}</b>K</span>` : ""}
        ${g.bb != null ? `<span><b>${g.bb}</b>BB</span>` : ""}
        ${g.h != null ? `<span><b>${g.h}</b>安打</span>` : ""}
        ${g.er != null ? `<span><b>${g.er}</b>自責点</span>` : ""}
      </div>
    ` : "";

    return row + buildDetailRow(i, basicChips, g.pitch_detail, g.course_detail);
  }).join("");

  return `
    <div class="section section-gamelog">
      ${sectionHeader({ bar:"var(--amber)", label:`${d.season_label || "シーズン"}成績`, labelColor:"var(--text-bright)", sub:`${d.games ?? "-"}試合・行タップで詳細` })}
      <div class="section-body">
        <div class="gamelog-scroll">
          <table class="gamelog-table">
            <thead><tr>
              <th>日付</th><th>対戦</th><th>結果</th>
              ${cols.map(c => `<th>${c.label}</th>`).join("")}
            </tr></thead>
            <tbody>${seasonRow}${gameRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

const PITCH_COLORS = ["#34D399","#FB923C","#F87171","#EC4899","#A78BFA","#60A5FA","#FBBF24","#22D3EE"];
function pitchColor(i){ return PITCH_COLORS[i % PITCH_COLORS.length]; }

// 初期ロード
loadPlayerIndex(currentLeague);
</script>
